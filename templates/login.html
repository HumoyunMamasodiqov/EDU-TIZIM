<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Edu Tizim - Kirish</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Segoe UI',sans-serif;
}

body{
    width:100%;
    height:100vh;
    background:linear-gradient(to right,#d8d8ea,#d9e5f1);
    display:flex;
    justify-content:center;
    align-items:center;
    overflow:hidden;
}

/* LOGO */
.logo{
    position:absolute;
    top:25px;
    left:35px;
    display:flex;
    align-items:center;
    gap:15px;
}

.logo-icon{
    width:55px;
    display:flex;
    flex-direction:column;
    gap:6px;
}

.logo-icon span{
    height:12px;
    background:#3f63f3;
    border-radius:10px;
}

.logo-icon span:nth-child(1){
    width:42px;
}

.logo-icon span:nth-child(2){
    width:35px;
}

.logo-icon span:nth-child(3){
    width:28px;
}

.logo-text h2{
    color:#3f63f3;
    font-size:20px;
    font-weight:700;
}

.logo-text p{
    font-size:14px;
    color:#333;
}

/* LANGUAGE */
.language{
    position:absolute;
    top:15px;
    right:25px;
    background:white;
    border-radius:10px;
    padding:10px 15px;
    display:flex;
    align-items:center;
    gap:10px;
    box-shadow:0 2px 10px rgba(0,0,0,.05);
    cursor:pointer;
}

.language img{
    width:22px;
}

.language span{
    font-size:14px;
}

/* LOGIN CARD */
.login-card{
    width:480px;
    background:white;
    border-radius:12px;
    padding:50px;
    box-shadow:0 10px 30px rgba(0,0,0,.06);
}

.login-title{
    text-align:center;
    font-size:22px;
    font-weight:700;
    margin-bottom:25px;
}

/* INPUT */
.input-box{
    width:100%;
    height:50px;
    background:#f1f1f1;
    border:none;
    border-radius:8px;
    padding:0 15px;
    font-size:18px;
    outline:none;
    margin-bottom:18px;
}

/* BUTTON */
.btn{
    width:100%;
    height:50px;
    border:none;
    border-radius:8px;
    background:#4166f5;
    color:white;
    font-size:16px;
    cursor:pointer;
    transition:.3s;
}

.btn:hover{

    background:#3457df;
    
}
</style>

</head>
<body>

<!-- LOGO -->
<div class="logo">
    <div class="logo-icon">
        <span></span>
        <span></span>
        <span></span>
    </div>

    <div class="logo-text">
        <h2>Edu tizim</h2>
        <p>bilan yanada osonroq</p>
    </div>
</div>

<!-- LANGUAGE -->
<div class="language">
    <img src="https://flagcdn.com/w40/uz.png" alt="">
    <span>▼</span>
</div>

<!-- LOGIN -->
<div class="login-card">

    <div class="login-title">
        Kirish
    </div>

    <input
        type="text"
        class="input-box"
        placeholder="+998"
    >

    <button class="btn">
        Tasdiqlash
    </button>

</div>

</body>
</html>
